    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#2b8bc1" flood-opacity=".16"/></filter>
  </defs>
  <circle cx="302" cy="215" r="181" fill="#e8f6fc"/>
